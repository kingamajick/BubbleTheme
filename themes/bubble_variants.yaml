  card-mod-theme: Bubble - 1. Botanical Laurel
  card-mod-root-yaml: ".: |\n  @media only screen and (max-width: 768px) {\n      .header {\n        display: none;\n        opacity: 0;\n      }\n      #view {\n        padding-top: 0 !important;\n        margin-top: 0 !important;\n        height: calc(100vh - env(safe-area-inset-top)) !important;\n      }\n  }\n"
  card-mod-more-info-yaml: "$: |\n .mdc-dialog .mdc-dialog__scrim {\n    backdrop-filter: blur(15px);\n    -webkit-backdrop-filter: blur(15px);\n    background: rgba(0,0,0,.6);\n } \n .mdc-dialog .mdc-dialog__container .mdc-dialog__surface {\n    box-shadow: none !important;\n    border-radius: var(--ha-card-border-radius);\n }\n.: |\n :host {\n    --ha-card-box-shadow: none;\n }\n"
  card-mod-view-yaml: "hui-sidebar-view:\n  $: |\n    .container {\n        overflow: hidden;\n        /* padding: 6px; */\n    }\n    @media only screen and (min-width: 768px) {\n        .container {\n          max-width: 520px;\n          margin: auto !important;\n          width: -webkit-fill-available;\n        }\n    }\n    #wrapper: |\n      $: |\n        #progressContainer {\n            border-radius: 14px !important;\n    }\n  .: |\n    \"#view>hui-view>hui-sidebar-view$#main>hui-card-options:nth-child(7)>vertical-stack-in-card$ha-card>div>hui-horizontal-stack-card$#root>hui-grid-card$#root>hui-entities-card$#states>div:nth-child(4)>slider-entity-row$div>ha-slider$#sliderBar$#progressContainer\" {\n        border-radius: 14px !important;\n    }\n"
  card-mod-card: "ha-card {\n  transition: none;\n  border-style: none !important;\n}\n/* Disable Home Assistant's built-in hover ripple overlay that lightens the background */\nha-ripple,\n.bubble-button-card-container > ha-ripple {\n  display: none !important;\n}\n\n/* \u2500\u2500\u2500 OFF / RESTING STATE \u2500\u2500\u2500 */\n.bubble-button-card-container {\n  border-radius: var(--theme-radius-card, 14px) !important;\n  background: var(--theme-surface, #161B1A) !important;\n  box-shadow: inset 0 0 0 1px var(--theme-border, rgba(255, 255, 255, 0.08)) !important;\n  transition: box-shadow 0.2s ease-in-out, background-color 0.2s ease-in-out !important;\n}\n.bubble-button-card-container:hover {\n  /* Strictly 1px hairline border illumination on hover; background is untouched */\n  box-shadow: inset 0 0 0 1px var(--theme-border-strong, rgba(255, 255, 255, 0.28)) !important;\n}\n\n/* Icon box when OFF: subtle accent-tinted background */\n.bubble-icon-container {\n  border-radius: var(--theme-radius-control,\
    \ 8px) !important;\n  background-color: var(--theme-icon-box-off, rgba(63, 167, 150, 0.12)) !important;\n  box-shadow: inset 0 0 0 1px rgba(63, 167, 150, 0.15) !important;\n  transition: all 0.2s ease-in-out !important;\n}\n/* Icon when OFF: subtle accent tint */\n.bubble-icon {\n  color: var(--theme-icon-off, #5A938C) !important;\n  transition: color 0.2s ease-in-out !important;\n}\n\n/* \u2500\u2500\u2500 ON / ACTIVE STATE \u2500\u2500\u2500 */\n/* 1. Switch Cards: whole card fills with muted Fluvy Harbour active fill (#253231) */\n.is-on .bubble-background {\n  background-color: var(--theme-accent-fill, #253231) !important;\n  background: var(--theme-accent-fill, #253231) !important;\n  opacity: 1 !important;\n  border-radius: var(--theme-radius-card, 14px) !important;\n}\n.is-on:not(:has(.bubble-range-slider)) .bubble-button-card-container,\n.is-on .bubble-button-card-container:not(.bubble-button-slider-container):not(:has(.bubble-range-slider)) {\n  background: var(--theme-accent-fill,\
    \ #253231) !important;\n}\n.is-off .bubble-background {\n  opacity: 0 !important;\n  background: transparent !important;\n}\n\n/* 2. Slider Cards: container stays dark resting surface so the percentage bar has clear contrast */\n.bubble-button-slider-container,\n.bubble-button-card-container:has(.bubble-range-slider),\n.is-on:has(.bubble-range-slider) .bubble-button-card-container {\n  background: var(--theme-surface, #161B1A) !important;\n  background-color: var(--theme-surface, #161B1A) !important;\n}\n:has(.bubble-range-slider) .bubble-background {\n  display: none !important;\n}\n.bubble-range-slider {\n  border-radius: var(--theme-radius-card, 14px) !important;\n}\n/* Slider fill bar: fills proportionally to percentage without vertical indicator edge */\n.bubble-range-fill {\n  background-color: var(--theme-accent-fill, #253231) !important;\n  background: var(--theme-accent-fill, #253231) !important;\n  opacity: 1 !important;\n  border-right: none !important;\n}\n\n/* 3. Icon box\
    \ INVERTS when ON: dark background cutout */\n.is-on .bubble-icon-container {\n  background-color: var(--theme-surface, #161B1A) !important;\n  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08) !important;\n}\n\n/* 4. Icon lights up highlighted */\n.is-on .bubble-icon {\n  color: var(--theme-accent, #3FA796) !important;\n}\n"
